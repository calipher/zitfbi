    <script>
      // Gracefully ignore WebSocket connection errors from Vite client in iframe sandbox
      window.addEventListener('error', function (e) {
        if (
          e.message &&
          (e.message.includes('WebSocket') ||
           e.message.includes('createWebSocketModuleRunnerTransport') ||
           e.message.includes('Failed to construct \'WebSocket\'') ||
           (e.filename && e.filename.includes('@vite/client')))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var str = String(e.reason || '');
        if (str.includes('WebSocket') || str.includes('createWebSocketModuleRunnerTransport')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
